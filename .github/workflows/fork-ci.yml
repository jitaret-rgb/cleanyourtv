name: Fork CI

# CI ของ fork (nenglab) — ดัดแปลงจาก .github/workflows/ci.yml ของ upstream:
# - trigger ครอบคลุม branch weather-line (ของ upstream ระบุเฉพาะ main) + กด Run ได้เอง
# - ตัดงาน "README tables" ออก (งานของ maintainer ฝั่ง upstream)
# - ตัด size gate 576 KB ออก — ใช้เป็น warning แทน (APK ตอนนี้ ~578 KB เกินเล็กน้อย
#   ต้องผอมลงก่อนส่ง PR ขึ้น upstream ที่จะรัน gate จริงของเขา)
# - ไม่เปิด CLEANYOURTV_STRICT (โหมดเดียวกับตอนเปิด PR)

on:
  push:
    branches: [weather-line]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Tools virtualenv
        run: |
          python3 -m venv tools/venv
          tools/venv/bin/pip install -q -r tools/requirements.txt
      - name: Unit tests
        run: tools/venv/bin/python -m unittest discover -s tests

  launcher:
    name: Launcher build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Unit tests, lint and release build
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: APK size (upstream gate = 576 KB, warning only here)
        run: |
          size=$(stat -c %s launcher/app/build/outputs/apk/release/app-release.apk)
          echo "release APK: $((size / 1024)) KB (upstream PR gate: 576 KB)"
          if [ "$size" -ge 589824 ]; then
            echo "::warning::APK is over upstream's 576 KB limit — slim it down before opening the PR"
          fi
      - name: Upload release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-release
          path: launcher/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
